name: Publish CEF Runtime Packages

on:
    workflow_dispatch:
        inputs:
            cefbuildversion:
                description: "CEF version (i.e. 156.0.15+gcf671c0+chromium-156.0.8078.80)"
                required: false
                default: "156.0.15+gcf671c0+chromium-156.0.8078.80"
            packages:
                description: "Packages to build"
                required: true
                default: "all"
                type: choice
                options:
                    - all
                    - linux-only
                    - macos-only
                    - windows-only
    # Rebuild the native CEF redist packages automatically when the pinned CEF
    # version changes on main. cef-version.json is the single source of truth;
    # when cefbuildversion is empty (as it is for push events) the redist scripts
    # and CefRuntime.csproj read the version from cef-version.json.
    push:
        branches:
            - main
        paths:
            - "cef-version.json"

jobs:
    build-linux-x64:
        name: Build Linux x64 Package
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.packages == '' || github.event.inputs.packages == 'all' || github.event.inputs.packages == 'linux-only' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download CEF runtime
              working-directory: CefRuntime
              run: |
                  chmod 755 make_cefredist_linux.sh
                  ./make_cefredist_linux.sh linux-x64 ${{ github.event.inputs.cefbuildversion }}

            - name: Create NuGet package
              working-directory: CefRuntime
              run: |
                  dotnet pack CefRuntime.csproj --runtime linux-x64 /p:CefBuildVersion=${{ github.event.inputs.cefbuildversion }}

            - name: Verify NuGet package contents
              run: |
                  echo "=== NuGet Package Contents ==="
                  unzip -l LocalPackages/*.nupkg | head -50
                  echo ""
                  echo "Checking for libcef.so in package..."
                  unzip -l LocalPackages/*.nupkg | grep libcef.so

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cef.runtime.linux-x64
                  path: LocalPackages/*.nupkg
                  retention-days: 30

    build-linux-arm64:
        name: Build Linux ARM64 Package
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.packages == '' || github.event.inputs.packages == 'all' || github.event.inputs.packages == 'linux-only' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install ARM64 cross tools
              run: sudo apt-get install -y binutils-aarch64-linux-gnu

            - name: Download CEF runtime
              working-directory: CefRuntime
              run: |
                  chmod 755 make_cefredist_linux.sh
                  ./make_cefredist_linux.sh linux-arm64 ${{ github.event.inputs.cefbuildversion }}

            - name: Create NuGet package
              working-directory: CefRuntime
              run: |
                  dotnet pack CefRuntime.csproj --runtime linux-arm64 /p:CefBuildVersion=${{ github.event.inputs.cefbuildversion }}

            - name: Verify NuGet package contents
              run: |
                  echo "=== NuGet Package Contents ==="
                  unzip -l LocalPackages/*.nupkg | head -50
                  echo ""
                  echo "Checking for libcef.so in package..."
                  unzip -l LocalPackages/*.nupkg | grep libcef.so

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cef.runtime.linux-arm64
                  path: LocalPackages/*.nupkg
                  retention-days: 30

    build-macos-x64:
        name: Build macOS x64 Package
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.packages == '' || github.event.inputs.packages == 'all' || github.event.inputs.packages == 'macos-only' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download CEF runtime
              working-directory: CefRuntime
              run: |
                  chmod 755 make_cefredist_osx.sh
                  ./make_cefredist_osx.sh osx-x64 ${{ github.event.inputs.cefbuildversion }}

            - name: Create NuGet package
              working-directory: CefRuntime
              run: |
                  dotnet pack CefRuntime.csproj --runtime osx-x64 /p:CefBuildVersion=${{ github.event.inputs.cefbuildversion }}
            
            - name: Verify NuGet package contents
              run: |
                  echo "=== NuGet Package Contents ==="
                  unzip -l LocalPackages/*.nupkg | head -50
                  echo ""
                  echo "Checking for Chromium Embedded Framework in package..."
                  unzip -l LocalPackages/*.nupkg | grep "Chromium Embedded Framework"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cef.runtime.osx-x64
                  path: LocalPackages/*.nupkg
                  retention-days: 30

    build-macos-arm64:
        name: Build macOS ARM64 Package
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.packages == '' || github.event.inputs.packages == 'all' || github.event.inputs.packages == 'macos-only' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download CEF runtime
              working-directory: CefRuntime
              run: |
                  chmod 755 make_cefredist_osx.sh
                  ./make_cefredist_osx.sh osx-arm64 ${{ github.event.inputs.cefbuildversion }}

            - name: Create NuGet package
              working-directory: CefRuntime
              run: |
                  dotnet pack CefRuntime.csproj --runtime osx-arm64 /p:CefBuildVersion=${{ github.event.inputs.cefbuildversion }}

            - name: Verify NuGet package contents
              run: |
                  echo "=== NuGet Package Contents ==="
                  unzip -l LocalPackages/*.nupkg | head -50
                  echo ""
                  echo "Checking for Chromium Embedded Framework in package..."
                  unzip -l LocalPackages/*.nupkg | grep "Chromium Embedded Framework"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cef.runtime.osx-arm64
                  path: LocalPackages/*.nupkg
                  retention-days: 30

    build-windows-x64:
        name: Build Windows x64 Package
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.packages == '' || github.event.inputs.packages == 'all' || github.event.inputs.packages == 'windows-only' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Create NuGet package
              working-directory: CefRuntime
              run: |
                  dotnet pack CefRuntime.csproj --runtime win-x64 /p:CefBuildVersion=${{ github.event.inputs.cefbuildversion }}

            - name: Verify NuGet package contents
              run: |
                  echo "=== NuGet Package Contents ==="
                  unzip -l LocalPackages/*.nupkg | head -50
                  echo ""
                  echo "Checking for libcef.dll in package..."
                  unzip -l LocalPackages/*.nupkg | grep libcef.dll
                  echo "Checking the package is not empty..."
                  SIZE=$(stat -c%s LocalPackages/cef.runtime.win-x64.*.nupkg)
                  echo "Package size: $((SIZE / 1048576)) MB"
                  test "$SIZE" -gt 104857600

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cef.runtime.win-x64
                  path: LocalPackages/*.nupkg
                  retention-days: 30

    build-windows-arm64:
        name: Build Windows ARM64 Package
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.packages == '' || github.event.inputs.packages == 'all' || github.event.inputs.packages == 'windows-only' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Create NuGet package
              working-directory: CefRuntime
              run: |
                  dotnet pack CefRuntime.csproj --runtime win-arm64 /p:CefBuildVersion=${{ github.event.inputs.cefbuildversion }}

            - name: Verify NuGet package contents
              run: |
                  echo "=== NuGet Package Contents ==="
                  unzip -l LocalPackages/*.nupkg | head -50
                  echo ""
                  echo "Checking for libcef.dll in package..."
                  unzip -l LocalPackages/*.nupkg | grep libcef.dll
                  echo "Checking the package is not empty..."
                  SIZE=$(stat -c%s LocalPackages/cef.runtime.win-arm64.*.nupkg)
                  echo "Package size: $((SIZE / 1048576)) MB"
                  test "$SIZE" -gt 104857600

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cef.runtime.win-arm64
                  path: LocalPackages/*.nupkg
                  retention-days: 30

    # Summary job that collects all artifacts
    summary:
        name: Collect All Packages
        runs-on: ubuntu-latest
        # NuGet/login exchanges a GitHub OIDC token for a short-lived nuget.org API
        # key, and minting that token needs id-token: write, which the default token
        # does not include. Granted only on this job: the six build jobs never touch
        # nuget.org. Naming permissions here replaces the defaults for this job, so
        # contents: read is listed explicitly.
        permissions:
            id-token: write
            contents: read
        needs:
            [
                build-linux-x64,
                build-linux-arm64,
                build-macos-x64,
                build-macos-arm64,
                build-windows-x64,
                build-windows-arm64,
            ]
        if: always()

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: all-packages
                  merge-multiple: true

            - name: List all packages
              run: |
                  echo "=== All Built Packages ==="
                  ls -la all-packages/ || echo "(no artifacts were downloaded)"
                  echo ""
                  echo "Package sizes:"
                  du -h all-packages/*.nupkg 2>/dev/null || echo "No packages found"

            - name: Upload combined artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cef-redist-all-packages
                  path: all-packages/*.nupkg
                  retention-days: 30
      
            # Publishing is irreversible - nuget.org versions are immutable, so a bad or
            # partial push can only be superseded, never replaced. Gate it: never publish
            # after a build failure, and only publish a set that matches the jobs that ran.
            # A deliberately partial run (packages: windows-only) skips the other jobs, so
            # "skipped" is fine; "failure" and "cancelled" are not.
            - name: Verify the package set
              id: verify
              env:
                  RESULTS: ${{ join(needs.*.result, ',') }}
              run: |
                  succeeded=0
                  broken=0
                  IFS=',' read -ra results <<< "$RESULTS"
                  for r in "${results[@]}"; do
                      case "$r" in
                          success) succeeded=$((succeeded + 1)) ;;
                          skipped) ;;
                          *) echo "build job result: $r"; broken=$((broken + 1)) ;;
                      esac
                  done
                  found=$(find all-packages -maxdepth 1 -name '*.nupkg' 2>/dev/null | wc -l)
                  echo "build jobs: $succeeded succeeded, $broken not succeeded; packages found: $found"

                  if [ "$broken" -ne 0 ]; then
                      echo "publish=false" >> $GITHUB_OUTPUT
                      echo "::warning::Not publishing: $broken build job(s) did not succeed."
                      exit 0
                  fi
                  if [ "$succeeded" -eq 0 ]; then
                      echo "publish=false" >> $GITHUB_OUTPUT
                      echo "::warning::Not publishing: no build jobs ran."
                      exit 0
                  fi
                  if [ "$found" -ne "$succeeded" ]; then
                      echo "::error::Expected $succeeded package(s) from the jobs that ran, found $found."
                      exit 1
                  fi
                  # A truncated stage still packs and still exits 0, so size is the only
                  # thing that catches it before the version is burned on nuget.org.
                  for p in all-packages/*.nupkg; do
                      size=$(stat -c%s "$p")
                      echo "$(basename "$p"): $((size / 1048576)) MB"
                      if [ "$size" -lt 104857600 ]; then
                          echo "::error::$(basename "$p") is only $((size / 1048576)) MB - the stage was probably truncated."
                          exit 1
                      fi
                  done
                  echo "publish=true" >> $GITHUB_OUTPUT

            # Get a short-lived NuGet API key
            - name: NuGet login (OIDC → temp API key)
              uses: NuGet/login@v1
              id: login
              if: steps.verify.outputs.publish == 'true'
              with:
                user: ${{ secrets.NUGET_USER }}
          
            - name: Push to NuGet.org
              if: steps.verify.outputs.publish == 'true'
              run: |
                  dotnet nuget push all-packages/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
