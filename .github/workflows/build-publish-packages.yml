name: Publish CefGlue Packages

on:
    workflow_dispatch:
    release:
        types: [published]

jobs:
    build-and-publish:
        name: Build and Publish
        runs-on: ubuntu-latest
        # NuGet/login exchanges a GitHub OIDC token for a short-lived nuget.org API key,
        # which needs id-token: write; the default token does not include it. Naming
        # permissions here replaces the defaults, so contents: read is listed explicitly
        # for actions/checkout.
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Determine version suffix
              id: version
              run: |
                  # Release tags look like `release/146.7680.179` (the leading `v` is
                  # optional, e.g. `release/v146.7680.179`). For those, publish a clean
                  # version with no suffix; otherwise tag a prerelease with branch+commits.
                  if [[ "${{ github.ref_name }}" =~ ^release/v?[0-9]+(\.[0-9]+)*$ ]]; then
                    echo "suffix=" >> $GITHUB_OUTPUT
                  else
                    BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]' | cut -c1-30)
                    COMMITS=$(git rev-list --count HEAD)
                    echo "suffix=${BRANCH}-${COMMITS}" >> $GITHUB_OUTPUT
                  fi

            - name: Restore dependencies
              run: dotnet restore Xilium.CefGlue.slnx

            - name: Build solution in Release
              run: dotnet build Xilium.CefGlue.slnx -c Release --no-restore /p:VersionSuffix=${{ steps.version.outputs.suffix }}

            - name: List generated packages
              run: |
                  echo "=== Generated NuGet Packages ==="
                  ls -la Nuget/output/*.nupkg
                  echo ""
                  echo "Package sizes:"
                  du -h Nuget/output/*.nupkg

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cefglue-packages
                  path: Nuget/output/*.nupkg
                  retention-days: 30

            # Get a short-lived NuGet API key
            - name: NuGet login (OIDC -> temp API key)
              uses: NuGet/login@v1
              id: login
              with:
                  user: ${{ secrets.NUGET_USER }}

            - name: Push to NuGet.org
              run: |
                  dotnet nuget push Nuget/output/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
